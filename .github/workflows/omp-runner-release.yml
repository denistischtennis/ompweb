name: omp runner release

# Runner-only releases: a newer omp for hosts on an ompweb release, without a new ompweb release. Each green build of the
# fork's `oml` branch (ompweb-dev/oh-my-pi) sends `omp-build` with its release tag. For every ompweb release hosts may run
# (OMPWEB_RELEASES), this builds that release's runner/ against the omp build and publishes it as the prerelease
# `runner-<ompweb version>-<omp tag>` with the assets a normal release attaches for its runner (ompweb-omp-<platform>[.exe],
# ompweb-omp.sha256). Hosts offer "Update omp" for the newest such release of their own ompweb version
# (lib/omp/runner-fetch.ts). Prereleases are never "latest", never an npm package, and send no update notice.
# A runner that fails tsc or its tests against the omp build publishes nothing for that ompweb version: the job fails, and
# its hosts need an ompweb update to get that omp.
on:
  repository_dispatch:
    types: [omp-build]
  workflow_dispatch:
    inputs:
      tag:
        description: "omp build tag in ompweb-dev/oh-my-pi (default: the newest build of its oml branch)"
        required: false
        type: string

# One run at a time, in arrival order: queued runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # The ompweb releases whose hosts get new omp builds, space separated: `latest` is the newest published vX.Y.Z release,
  # anything else a vX.Y.Z tag. Add a tag to keep an older version's hosts current.
  OMPWEB_RELEASES: latest

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      omp_tag: ${{ steps.plan.outputs.omp_tag }}
      ompweb_tags: ${{ steps.plan.outputs.ompweb_tags }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          # Untrusted (a dispatch payload or input): read through the environment, checked below.
          REQUESTED_TAG: ${{ inputs.tag || github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          omp_tag="$REQUESTED_TAG"
          if [ -z "$omp_tag" ]; then
            sha=$(gh api repos/ompweb-dev/oh-my-pi/commits/oml --jq .sha)
            omp_tag=$(gh api --paginate 'repos/ompweb-dev/oh-my-pi/releases?per_page=100' --jq '.[].tag_name' \
              | grep -E "^v[0-9]+\.[0-9]+\.[0-9]+-int\.[0-9]{12}\.g${sha:0:7}\$" | head -n 1 || true)
            if [ -z "$omp_tag" ]; then
              echo "::error::ompweb-dev/oh-my-pi has no integration release for oml ($sha)"
              exit 1
            fi
          fi
          if ! [[ "$omp_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-int\.[0-9]{12}\.g[0-9a-f]{7}$ ]]; then
            echo "::error::$omp_tag is not an omp build tag (v<version>-int.<stamp>.g<sha7>)"
            exit 1
          fi
          gh release view "$omp_tag" --repo ompweb-dev/oh-my-pi >/dev/null
          tags=()
          for entry in $OMPWEB_RELEASES; do
            if [ "$entry" = latest ]; then entry=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name); fi
            if ! [[ "$entry" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::$entry is not an ompweb release tag (vX.Y.Z)"
              exit 1
            fi
            # Already published for this omp build (a re-run, or a repeated dispatch): nothing to do for it.
            if gh release view "runner-${entry#v}-$omp_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "runner-${entry#v}-$omp_tag already exists"
            else
              tags+=("$entry")
            fi
          done
          echo "omp_tag=$omp_tag" >> "$GITHUB_OUTPUT"
          echo "ompweb_tags=$(printf '%s\n' "${tags[@]}" | sort -u | jq -R 'select(. != "")' | jq -sc .)" >> "$GITHUB_OUTPUT"

  runner:
    name: Runner for ompweb ${{ matrix.ompweb }}
    needs: plan
    if: needs.plan.outputs.ompweb_tags != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ompweb: ${{ fromJSON(needs.plan.outputs.ompweb_tags) }}
    env:
      OMP_TAG: ${{ needs.plan.outputs.omp_tag }}
      OMPWEB_TAG: ${{ matrix.ompweb }}
    steps:
      # The ompweb release as it shipped, so its hosts get a runner of the source they run.
      - name: Checkout the ompweb release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.ompweb }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Not committed back. Without GH_TOKEN: bun install runs the omp packages' scripts.
      - name: Pin the runner to the omp build
        run: bun runner/scripts/use-omp-build.ts "$OMP_TAG"

      - name: Typecheck
        working-directory: runner
        run: bunx tsc -p .

      - name: Test
        working-directory: runner
        run: bun test

      # As omp-runner.yml and scripts/build-release-binaries.sh: every target's native addon, then the five binaries.
      - name: Build the runner binaries
        working-directory: runner
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --os='*' --cpu='*'
          bun scripts/build-binary.ts linux-x64 linux-arm64 darwin-x64 darwin-arm64 windows-x64

      - name: Smoke test
        run: |
          set -euo pipefail
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" runner/release/ompweb-omp-linux-x64 --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" runner/release/ompweb-omp-linux-x64 --smoke-test

      - name: Publish the runner release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runners=(ompweb-omp-linux-x64 ompweb-omp-linux-arm64 ompweb-omp-darwin-x64 ompweb-omp-darwin-arm64 ompweb-omp-windows-x64.exe)
          (cd runner/release && sha256sum "${runners[@]}" > ompweb-omp.sha256)
          tag="runner-${OMPWEB_TAG#v}-$OMP_TAG"
          # A draft first, so a failed upload never leaves a published release missing assets.
          gh release create "$tag" "${runners[@]/#/runner/release/}" runner/release/ompweb-omp.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --draft --prerelease --latest=false --title "$tag" \
            --notes "omp runner for ompweb $OMPWEB_TAG, built against omp: ompweb-dev/oh-my-pi $OMP_TAG. Not a release: no npm package, no update notice. Hosts on ompweb ${OMPWEB_TAG#v} offer it as Update omp."
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
